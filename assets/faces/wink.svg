<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 0 328 350"><style>.hd,.eyes,.mouth,.brows,.fx{transform-box:fill-box}
.hd{transform-origin:50% 100%}.eyes{transform-origin:50% 50%}.mouth{transform-origin:50% 0%}.fx{transform-origin:50% 50%}.brows{transform-origin:50% 50%}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes laugh{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-2deg)}75%{transform:translateY(-7px) rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-12px) scale(1.03)}}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(40deg);opacity:1}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%,15%{opacity:0;transform:scale(.3)}35%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes drip{0%{opacity:0;transform:translateY(-6px)}20%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes glint{0%,55%,100%{opacity:0}68%{opacity:1}80%{opacity:0}}
@keyframes qbob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
@keyframes float{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(-10px,-26px)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes brow{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
